name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q tests/test_configuration.py tests/test_audit_service.py tests/test_failure_modes.py tests/test_resilience.py tests/test_scenario_c.py

  build-and-validate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t audit-log-service:test .
      - name: Validate container health
        run: |
          docker run -d --rm --name audit-log-service-test -p 8000:8000 -e DB_BACKEND=sqlite audit-log-service:test
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/health >/tmp/health.json; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/health >/tmp/health.json
          cat /tmp/health.json
          docker rm -f audit-log-service-test >/dev/null 2>&1 || true

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build-and-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: Validate Kubernetes manifests
        run: kubectl apply --dry-run=client -f k8s/
      - name: Deploy to Kubernetes
        if: ${{ secrets.KUBECONFIG_B64 != '' }}
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          kubectl apply -f k8s/
          kubectl rollout status deployment/audit-log-service -n auditlog --timeout=300s
