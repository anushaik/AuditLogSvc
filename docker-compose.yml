version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auditlog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_BACKEND: postgres
      DATABASE_URL: postgresql://postgres:postgres@db:5432/auditlog
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  postgres_data:
